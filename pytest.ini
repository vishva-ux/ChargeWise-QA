[pytest]
testpaths = ui/tests api/tests database/tests e2e/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --strict-markers
    --tb=short
    --alluredir=reports/allure-results

markers =
    smoke: Quick sanity smoke tests for core functionality
    regression: Comprehensive regression test suite
    ui: Frontend User Interface automated tests with Selenium
    api: Backend & ML microservice REST API tests
    db: Database verification and data integrity tests
    e2e: End-to-end integration and user journey tests
    critical: High severity business blocking flows
    slow: Tests that execute complex or long running interactions

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
